; Shelf sensor node: Arduino Uno R3 on USB serial to the Pi.
;   pio run -t upload && pio device monitor
; The Pi's shelf-bridge service turns its JSON lines into MQTT.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/DHT sensor library @ ^1.4
	adafruit/Adafruit Unified Sensor @ ^1.1
	claws/BH1750 @ ^1.3
	paulstoffregen/OneWire @ ^2.3
	milesburton/DallasTemperature @ ^3.11
