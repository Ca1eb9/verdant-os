; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

; Settings shared by every environment
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; chain+ evaluates #if blocks, so only the selected RFID library is compiled
lib_ldf_mode = chain+
build_flags =
	-DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
	adafruit/Adafruit PN532
	miguelbalboa/MFRC522
	knolleary/PubSubClient
	bblanchon/ArduinoJson @ ^7
	stm32duino/STM32duino VL53L4CX

; Full robot firmware (main.cpp creates all four tasks)
[env:esp32]
build_src_filter = +<*> -<bench/>

; Sprint 1 bench test: sensor + comms tasks with a stand-in nav task.
;   pio run -e bench -t upload && pio device monitor
[env:bench]
build_src_filter = +<*> -<main.cpp>
