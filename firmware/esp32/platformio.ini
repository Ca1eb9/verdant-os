; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32

; Settings shared by every environment
[env]
platform = espressif32
; The team's boards are ESP32-S3-WROOM-1 DevKitC. For a classic ESP32 DevKit,
; use `board = esp32dev` and delete the three ARDUINO_USB lines below.
; config.h picks the matching pin set automatically.
board = esp32-s3-devkitc-1
; 4 MB layout runs on every S3 module (N4, N8, N16) - the app is ~0.9 MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
framework = arduino
monitor_speed = 115200
; chain+ evaluates #if blocks, so only the selected RFID library is compiled
lib_ldf_mode = chain+
build_flags =
	-DARDUINOJSON_USE_LONG_LONG=1
	; Serial goes over the S3's native USB port (the one marked "USB")
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	adafruit/Adafruit PN532
	miguelbalboa/MFRC522
	knolleary/PubSubClient
	bblanchon/ArduinoJson @ ^7
	stm32duino/STM32duino VL53L4CX

; Full robot firmware (main.cpp creates all four tasks)
[env:esp32]
build_src_filter = +<*> -<bench/> -<wifitest/>

; Sprint 1 bench test: sensor + comms tasks with a stand-in nav task.
;   pio run -e bench -t upload && pio device monitor -e bench
[env:bench]
build_src_filter = +<*> -<main.cpp> -<wifitest/>

; WiFi-only diagnostic: scan, connect with failure reasons, broker check.
;   pio run -e wifitest -t upload && pio device monitor -e wifitest
[env:wifitest]
build_src_filter = -<*> +<wifitest/>
